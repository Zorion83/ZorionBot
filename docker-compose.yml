services:
  donchianbot:
    container_name: donchianbot
    build: .
    restart: unless-stopped
    env_file:
      - /srv/data/donchianbot/.env
    volumes:
      - /srv/data/donchianbot:/app/data
    environment:
      - DATA_DIR=/app/data
      - MR_TP_ATR=1.0
      - MR_TIME_STOP=48
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
