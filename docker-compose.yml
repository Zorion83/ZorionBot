services:
  raspi_algo02:
    container_name: Raspi_algo02
    build: .
    restart: unless-stopped
    env_file:
      - /srv/data/raspi_algo02/.env
    volumes:
      - /srv/data/raspi_algo02:/app/data
    environment:
      - DATA_DIR=/app/data
      - MR_TIME_STOP=48
      # MR_TP_ATR (ancien TP unique) retiré : plus utilisé côté IG depuis le
      # scaling en 3 paliers (MR_TP1_ATR/MR_TP2_ATR/MR_TP3_ATR, défauts
      # 1.0/2.0/3.0 dans config.py — override ici si besoin de les changer).
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
